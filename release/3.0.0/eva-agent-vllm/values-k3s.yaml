routerSpec:
  staticBackends: "http://eva-agent-vllm-qwen3-vl-8b-fp8-engine-service.eva-agent.svc.cluster.local,http://external-vllm:port"
  staticModels: "qwen3-vl-8b-instruct-fp8,Exaone4.0"
  serviceType: ClusterIP
  nodePort:

  nodeSelectorTerms:
    - matchExpressions:
      - key: node.kubernetes.io/instance-type
        operator: In
        values:
          - k3s
      - key: kubernetes.io/os
        operator: In
        values:
          - linux

servingEngineSpec:
  runtimeClassName: "nvidia"
  modelSpec:
    - serviceAccountName: sa-eva-agent
      serviceType: ClusterIP
      nodePort:
      name: "qwen3-vl-8b-fp8"
      modelURL: "Qwen/Qwen3-VL-8B-Instruct-FP8"
      repository: "vllm/vllm-openai"
      tag: "v0.21.0"

      # Increase replicaCount to use multiple MIG slices; each replica requests one GPU/MIG device.
      replicaCount: 1
      requestCPU: 4
      requestMemory: "10Gi"
      requestGPU: 1
      # MIG node: requestGPUType: "nvidia.com/mig-1g.24gb"
      # non-MIG GPU: requestGPUType: "nvidia.com/gpu"
      requestGPUType: "nvidia.com/mig-1g.24gb" # non-MIG: "nvidia.com/gpu"
      envFromSecret:
        name: aws-credentials
      initContainer:
        name: s3-sync
        image: amazon/aws-cli:2.33.8
        command:
          - sh
          - -c
          - aws s3 sync s3://s3-an2-mellerikat-release-eva-agent/vllm/hf /data/shared-pvc-storage
        extraVolumeMounts:
          - name: eva-agent-vllm-shared-pvc-storage
            mountPath: /data/shared-pvc-storage
        env:
          - name: AWS_REGION
            value: ap-northeast-2

      vllmConfig:
        host: "0.0.0.0"
        tensorParallelSize: 1
        gpuMemoryUtilization: 0.6
        enableChunkedPrefill: true
        enablePrefixCaching: true
        maxModelLen: 12288
        dtype: "auto"
        extraArgs:
          - "--served-model-name"
          - "qwen3-vl-8b-instruct-fp8"
          - "--kv-cache-dtype"
          - "auto"
          - "--max-num-batched-tokens"
          - "4096"

      nodeSelectorTerms:
        - matchExpressions:
          - key: node.kubernetes.io/instance-type
            operator: In
            values:
              - k3s
          - key: kubernetes.io/os
            operator: In
            values:
              - linux

sharedPvcStorage:
  mode: static
  size: "30Gi"
  accessModes:
    - "ReadWriteMany"
  storageClass: "eva-agent-sc-fs"
  nfs:
    server: "localhost"
    path: /data001/share/eva-agent/vllm-cache
