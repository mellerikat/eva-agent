routerSpec:
  repository: "lmcache/lmstack-router"
  tag: "v0.1.10"
  enableRouter: true
  routingLogic: "roundrobin"
  serviceDiscovery: "static"
  staticBackends: "http://eva-agent-vllm-qwen35-vl-9b-fp8-engine-service.eva-agent.svc.cluster.local"
  staticModels: "qwen3.5-vl-9b-fp8"

  serviceType: ClusterIP
  nodePort:
  servicePort: 80
  containerPort: 8000

  resources:
    requests:
      cpu: 400m
      memory: 4Gi
    limits:
      memory: 4Gi

  nodeSelectorTerms: []

servingEngineSpec:
  runtimeClassName: "nvidia"
  modelSpec:
    - serviceAccountName: sa-eva-agent
      serviceType: ClusterIP
      nodePort:
      name: "qwen35-vl-9b-fp8"
      modelURL: "lovedheart/Qwen3.5-9B-FP8"
      repository: "vllm/vllm-openai"
      tag: "v0.21.0"

      replicaCount: 3
      requestCPU: 4
      requestMemory: "10Gi"
      requestGPU: 1
      requestGPUType: "nvidia.com/mig-1g.24gb"
      env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: HF_HUB_DISABLE_TELEMETRY
          value: "1"
      envFromSecret:
        name: aws-credentials
      initContainer:
        name: s3-sync
        image: amazon/aws-cli:2.33.8
        awsRegion: ap-northeast-2

      enableTool: true
      toolCallParser: "qwen3_coder"

      vllmConfig:
        host: "0.0.0.0"
        tensorParallelSize: 1
        gpuMemoryUtilization: 0.9
        enableChunkedPrefill: true
        enablePrefixCaching: true
        maxModelLen: "12K"
        dtype: "auto"
        extraArgs:
          - "--served-model-name"
          - "qwen3.5-vl-9b-fp8"
          - "--reasoning-parser"
          - "qwen3"
          - "--kv-cache-dtype"
          - "fp8"
          - "--max-num-batched-tokens"
          - "4K"
          - "--max-num-seqs"
          - "32"
          - "--disable-access-log-for-endpoints"
          - "/health,/metrics,/ping"

      nodeSelectorTerms: []

sharedPvcStorage:
  mode: static
  size: "50Gi"
  accessModes:
    - "ReadWriteMany"
  storageClass: "eva-agent-sc-fs"
  nfs:
    server: "localhost"
    path: /share/eva-agent/vllm-cache
