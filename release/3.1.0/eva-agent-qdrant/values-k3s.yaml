nameOverride: "eva-agent-qdrant"

serviceAccount:
  create: false
  name: sa-eva-agent

image:
  pullPolicy: Always
  tag: v1.18.2

# Preserve the existing k3s exposure configured on the cluster.
service:
  type: NodePort

# Qdrant storage PVC.
persistence:
  storageVolumeName: eva-agent-qdrant-storage
  storageClassName: eva-agent-sc-bs

# Separate PVC used for Qdrant snapshots and the bootstrap snapshot.
snapshotPersistence:
  enabled: true
  snapshotsVolumeName: eva-agent-qdrant-snapshots
  storageClassName: eva-agent-sc-bs

# Snapshot recovery is handled by the aws-cli snapshot sidecar.
snapshotRestoration:
  enabled: false

nodeSelector:
  node.kubernetes.io/instance-type: k3s
  kubernetes.io/os: linux

# Snapshot synchronization and reconciliation. Configure one line per
# collection as: s3Directory|snapshotFile|logicalCollection.
# Leave s3Directory empty in an air-gapped deployment: the snapshot must then
# already exist on the snapshot PVC at SNAPSHOT_LOCAL_ROOT/snapshotFile.
sidecarContainers:
  - name: qdrant-snapshot-sync
    image: amazon/aws-cli:2.33.8
    imagePullPolicy: IfNotPresent
    command:
      - /bin/bash
      - -ec
    args:
      - |
        set -u -o pipefail

        readonly ready_file=/tmp/qdrant-snapshot-sync.ready
        readonly qdrant_url="${QDRANT_URL%/}"
        readonly s3_prefix="${S3_PREFIX#/}"
        readonly local_root="${SNAPSHOT_LOCAL_ROOT%/}"
        declare -a qdrant_headers=()
        if [[ -n "${QDRANT_API_KEY:-}" ]]; then
          qdrant_headers=(-H "api-key: ${QDRANT_API_KEY}")
        fi

        qdrant_get() {
          curl -fsS "${qdrant_headers[@]}" "$1"
        }

        qdrant_status() {
          curl -sS "${qdrant_headers[@]}" -o /dev/null -w '%{http_code}' "$1"
        }

        qdrant_json() {
          curl -fsS "${qdrant_headers[@]}" -H 'Content-Type: application/json' -X "$1" -d "$3" "$2"
        }

        collection_name_part() {
          printf '%s' "$1" | tr -cs '[:alnum:]_-' '_'
        }

        wait_for_qdrant() {
          until qdrant_get "${qdrant_url}/readyz" >/dev/null; do
            echo 'waiting for Qdrant readiness' >&2
            sleep 2
          done
        }

        alias_target() {
          qdrant_get "${qdrant_url}/aliases" \
            | jq -r --arg alias "$1" '[.result.aliases[]? | select(.alias_name == $alias) | .collection_name][0] // empty'
        }

        collection_is_healthy() {
          qdrant_get "${qdrant_url}/collections/$1" \
            | jq -e '.status == "ok" and (.result.status == "green" or .result.status == "yellow") and (.result.points_count != null)' >/dev/null
        }

        download_or_use_local_snapshot() {
          local s3_directory="$1"
          local snapshot_file="$2"
          local local_file

          if [[ -n "${s3_directory}" ]]; then
            local_file="${local_root}/${s3_directory}/${snapshot_file}"
          else
            local_file="${local_root}/${snapshot_file}"
          fi

          if [[ -s "${local_file}" ]]; then
            printf '%s\n' "${local_file}"
            return 0
          fi

          if [[ -z "${s3_directory}" ]]; then
            echo "offline snapshot is missing from PVC: ${local_file}" >&2
            return 1
          fi

          mkdir -p "$(dirname "${local_file}")" || return 1
          local remote="s3://${S3_BUCKET}/${s3_prefix}/${s3_directory}/${snapshot_file}"
          echo "downloading ${remote}" >&2
          aws s3 cp "${remote}" "${local_file}.partial" || return 1
          mv "${local_file}.partial" "${local_file}" || return 1
          [[ -s "${local_file}" ]] || return 1
          printf '%s\n' "${local_file}"
        }

        switch_alias() {
          local logical_collection="$1"
          local target_collection="$2"
          local current_collection payload physical_status

          current_collection="$(alias_target "${logical_collection}")" || return 1
          [[ "${current_collection}" == "${target_collection}" ]] && return 0

          if [[ -n "${current_collection}" ]]; then
            payload="$(jq -cn --arg alias "${logical_collection}" --arg target "${target_collection}" '{actions: [{delete_alias: {alias_name: $alias}}, {create_alias: {alias_name: $alias, collection_name: $target}}]}')"
          else
            physical_status="$(qdrant_status "${qdrant_url}/collections/${logical_collection}")" || return 1
            if [[ "${physical_status}" == '200' ]]; then
              echo "physical collection conflicts with required alias: ${logical_collection}; perform the one-time alias migration first" >&2
              return 1
            fi
            payload="$(jq -cn --arg alias "${logical_collection}" --arg target "${target_collection}" '{actions: [{create_alias: {alias_name: $alias, collection_name: $target}}]}')"
          fi

          qdrant_json POST "${qdrant_url}/collections/aliases" "${payload}" | jq -e '.status == "ok"' >/dev/null
        }

        reconcile_snapshot() {
          local s3_directory="$1"
          local snapshot_file="$2"
          local logical_collection="$3"
          local snapshot_path snapshot_version target_collection status

          [[ -n "${snapshot_file}" && -n "${logical_collection}" ]] || return 1
          snapshot_path="$(download_or_use_local_snapshot "${s3_directory}" "${snapshot_file}")" || return 1
          snapshot_version="$(collection_name_part "${snapshot_file%.snapshot}")"
          target_collection="${logical_collection}__${snapshot_version}"
          status="$(qdrant_status "${qdrant_url}/collections/${target_collection}")" || return 1

          case "${status}" in
            200)
              collection_is_healthy "${target_collection}" || return 1
              ;;
            404)
              echo "restoring ${snapshot_file} into ${target_collection}" >&2
              curl -fsS "${qdrant_headers[@]}" -X POST \
                "${qdrant_url}/collections/${target_collection}/snapshots/upload?wait=true&priority=snapshot" \
                -F "snapshot=@${snapshot_path}" \
                | jq -e '.status == "ok"' >/dev/null || return 1
              collection_is_healthy "${target_collection}" || return 1
              ;;
            *)
              echo "unexpected collection status ${status} for ${target_collection}" >&2
              return 1
              ;;
          esac

          switch_alias "${logical_collection}" "${target_collection}"
        }

        serving_collections_already_available() {
          local s3_directory snapshot_file logical_collection ignored
          while IFS='|' read -r s3_directory snapshot_file logical_collection ignored; do
            [[ -z "${s3_directory}${snapshot_file}${logical_collection}" || "${s3_directory}" == \#* ]] && continue
            if [[ -n "$(alias_target "${logical_collection}")" ]]; then
              continue
            fi
            [[ "$(qdrant_status "${qdrant_url}/collections/${logical_collection}")" == '200' ]] || return 1
          done <<< "${SNAPSHOT_SPECS}"
        }

        reconcile_all() {
          local s3_directory snapshot_file logical_collection ignored
          while IFS='|' read -r s3_directory snapshot_file logical_collection ignored; do
            [[ -z "${s3_directory}${snapshot_file}${logical_collection}" || "${s3_directory}" == \#* ]] && continue
            reconcile_snapshot "${s3_directory}" "${snapshot_file}" "${logical_collection}" || return 1
          done <<< "${SNAPSHOT_SPECS}"
        }

        rm -f "${ready_file}"
        wait_for_qdrant
        serving_collections_already_available && touch "${ready_file}" || true

        while true; do
          if reconcile_all; then
            touch "${ready_file}"
          else
            echo 'snapshot reconciliation failed; serving aliases are unchanged' >&2
          fi
          sleep "${RECONCILE_INTERVAL_SECONDS}"
        done
    env:
      - name: S3_BUCKET
        value: s3-an2-mellerikat-release-eva-agent
      - name: S3_PREFIX
        value: agent/qdrant
      - name: SNAPSHOT_LOCAL_ROOT
        value: /qdrant/snapshots/bootstrap
      - name: QDRANT_URL
        value: http://127.0.0.1:6333
      - name: RECONCILE_INTERVAL_SECONDS
        value: "300"
      - name: SNAPSHOT_SPECS
        value: |
          eva_manual_qwen3vl_collections|eva_manual_qwen3vl_20260804.snapshot|chat2_qwen3vl_sum_collections
    envFrom:
      - secretRef:
          name: aws-credentials
          optional: true
    readinessProbe:
      exec:
        command:
          - /bin/bash
          - -ec
          - test -f /tmp/qdrant-snapshot-sync.ready
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    volumeMounts:
      - name: eva-agent-qdrant-snapshots
        mountPath: /qdrant/snapshots
