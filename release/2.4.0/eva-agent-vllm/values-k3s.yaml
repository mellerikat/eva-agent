routerSpec:
  nodeSelectorTerms:
    - matchExpressions:
      - key: node.kubernetes.io/instance-type
        operator: In
        values:
          - k3s
      - key: beta.kubernetes.io/os
        operator: In
        values:
          - linux

servingEngineSpec:
  modelSpec:
    - serviceAccountName: sa-eva-agent
      name: "qwen3-vl-8b-fp8"
      modelURL: "Qwen/Qwen3-VL-8B-Instruct-FP8"
      repository: "vllm/vllm-openai"
      tag: "v0.14.1"

      replicaCount: 1
      requestCPU: 4
      requestMemory: "10Gi"
      # requestGPU: 1
      envFromSecret:
        name: aws-credentials
      initContainer:
        name: s3-sync
        image: amazon/aws-cli:2.33.8
        command:
          - sh
          - -c
          - aws s3 sync s3://s3-an2-mellerikat-release-eva-agent/vllm/hf /data/shared-pvc-storage
        extraVolumeMounts:
          - name: eva-agent-vllm-shared-pvc-storage
            mountPath: /data/shared-pvc-storage
        env:
          - name: AWS_REGION
            value: ap-northeast-2

      vllmConfig:
        host: "0.0.0.0"
        tensorParallelSize: 1
        gpuMemoryUtilization: 0.7
        enableChunkedPrefill: true
        enablePrefixCaching: true
        maxModelLen: 12288
        dtype: "auto"
        extraArgs:
          - "--served-model-name"
          - "qwen3-vl-8b-instruct-fp8"
          - "--kv-cache-dtype"
          - "auto"
          - "--max-num-batched-tokens"
          - "4096"

      nodeSelectorTerms:
        - matchExpressions:
          - key: node.kubernetes.io/instance-type
            operator: In
            values:
              - k3s
          - key: beta.kubernetes.io/os
            operator: In
            values:
              - linux
        #   - key: nvidia.com/gpu
        #     operator: In
        #     values:
        #       - "true"

sharedPvcStorage:
  mode: static
  size: "30Gi"
  accessModes:
    - "ReadWriteMany"
  storageClass: "eva-agent-sc-fs"
  nfs:
    server: "localhost"
    path: /data001/share/eva-agent/vllm-cache
