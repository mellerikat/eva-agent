routerSpec:
  nodeSelectorTerms:
    - matchExpressions:
        - key: eks.amazonaws.com/nodegroup
          operator: In
          values:
            - ng-an2-eva-agent-gpu

servingEngineSpec:
  modelSpec:
    - serviceAccountName: sa-eva-agent
      name: "qwen3-vl-8b-fp8"
      modelURL: "Qwen/Qwen3-VL-8B-Instruct-FP8"
      repository: "vllm/vllm-openai"
      tag: "v0.14.1"

      replicaCount: 1
      requestCPU: 4
      requestMemory: "10Gi"
      requestGPU: 1

      pvcStorage: "30Gi"
      storageClass: "eva-agent-sc-fs"
      pvcAccessMode:
        - "ReadWriteMany"
      envFromSecret:
        name: aws-credentials
      initContainer:
        name: s3-sync
        image: amazon/aws-cli:2.33.8
        command:
          - sh
          - -c
          - aws s3 sync s3://s3-an2-mellerikat-release-eva-agent/vllm/hf /data
        mountPvcStorage: true
        env:
          - name: AWS_REGION
            value: ap-northeast-2

      vllmConfig:
        host: "0.0.0.0"
        tensorParallelSize: 1
        gpuMemoryUtilization: 0.7
        enableChunkedPrefill: true
        enablePrefixCaching: true
        maxModelLen: 12288
        dtype: "auto"
        extraArgs:
          - "--served-model-name"
          - "qwen3-vl-8b-instruct-fp8"
          - "--kv-cache-dtype"
          - "auto"
          - "--max-num-batched-tokens"
          - "4096"

      nodeSelectorTerms:
      - matchExpressions:
        - key: eks.amazonaws.com/nodegroup
          operator: In
          values:
            - ng-an2-eva-agent-gpu
