servingEngineSpec:
  runtimeClassName: ""
  modelSpec:
  - name: "qwen2-5-vl-32b-awq"
    modelURL: "Qwen/Qwen2.5-VL-32B-Instruct-AWQ"
    repository: "vllm/vllm-openai"
    tag: "v0.11.0"

    serviceAccountName: sa-eva-agent

    replicaCount: 1

    requestCPU: 4
    requestMemory: "32Gi"
    requestGPU: 1

    pvcStorage: "30Gi"
    storageClass: "eva-agent-sc-fs"
    pvcAccessMode:
      - "ReadWriteMany"

    # Custom arguments for vllm serve
    # https://artifacthub.io/packages/helm/vllm-production-stack/vllm-stack?modal=template&template=deployment-vllm-multi.yaml
    vllmConfig:
      host: "0.0.0.0"
      # port: 9149 # use default 8000
      tensorParallelSize: 1
      gpuMemoryUtilization: 0.75
      maxModelLen: 4096
      extraArgs:
        - "--served-model-name"
        - "qwen2.5-vl-32b-awq"

    nodeSelectorTerms:
      - matchExpressions:
         - key: kubernetes.io/os
           operator: In
           values:
             - linux
