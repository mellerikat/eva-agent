nameOverride: "eva-agent-qdrant"
fullnameOverride: ""

serviceAccount:
  create: false
  name: sa-eva-agent

image:
  pullPolicy: Always

# Storage PVC config
persistence:
  accessModes: ["ReadWriteOnce"]
  size: 10Gi
  annotations: {}
  storageVolumeName: eva-agent-qdrant-storage
  storageClassName: eva-agent-sc-bs

# Snapshot PVC config (backup point)
snapshotPersistence:
  enabled: true
  accessModes: ["ReadWriteOnce"]
  size: 10Gi
  annotations: {}
  snapshotsVolumeName: eva-agent-qdrant-snapshots
  storageClassName: eva-agent-sc-bs

# Optional advanced external PVC source for runtime API recovery.
# snapshotRestoration:
#   enabled: false
#   pvcName: qdrant-snapshot-restore-pvc
#   mountPath: /qdrant/snapshot-restoration
#   snapshots: []

nodeSelector: {}
