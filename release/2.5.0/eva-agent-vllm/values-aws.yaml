routerSpec:
  nodeSelectorTerms:
    - matchExpressions:
        - key: eks.amazonaws.com/nodegroup
          operator: In
          values:
            - ng-an2-eva-agent

servingEngineSpec:
  runtimeClassName: "nvidia"
  modelSpec:
    - name: "qwen3-vl-8b-fp8"
      modelURL: "Qwen/Qwen3-VL-8B-Instruct-FP8"
      repository: "vllm/vllm-openai"
      tag: "v0.11.0"

      serviceAccountName: sa-eva-agent
      replicaCount: 1

      requestCPU: 4
      requestMemory: "28Gi"
      requestGPU: 1

      pvcStorage: "30Gi"
      storageClass: "eva-agent-sc-fs"
      pvcAccessMode:
        - "ReadWriteMany"

      vllmConfig:
        host: "0.0.0.0"
        tensorParallelSize: 1
        gpuMemoryUtilization: 0.9
        enableChunkedPrefill: true
        enablePrefixCaching: true
        maxModelLen: 12288
        dtype: "auto"
        extraArgs:
          - "--served-model-name"
          - "qwen3-vl-8b-instruct-fp8"
          - "--kv-cache-dtype"
          - "fp8"
          - "--max-num-batched-tokens"
          - "4096"

      nodeSelectorTerms:
      - matchExpressions:
        - key: eks.amazonaws.com/nodegroup
          operator: In
          values:
            - ng-an2-eva-agent-gpu
