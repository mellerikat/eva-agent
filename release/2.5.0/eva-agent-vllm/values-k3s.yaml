routerSpec:
  # 여러 모델 사용 시 필요한 Model Router를 켤지 끌지 여부
  enableRouter: true

  # 라우팅에 사용할 서비스 방식
  # 사내용 Exaone은 185 서버에 띄워뒀고, 같은 kubectl context로 묶여있지 않음
  # 외부에서 접속 가능한 endpoint를 직접 입력하는 static 방식 사용
  # default값이 k8s는 같은 k8s cluster에 묶인 node여야함 (사내 EVA 시나리오와 맞지 않음)
  routingLogic: "roundrobin"

  # 185 서버의 EXAONE4.0 vLLM은 docker로 띄워둠 (8222 포트)
  # served-model-name을 사용한다
  serviceDiscovery: "static"
  staticBackends: "http://eva-agent-vllm-qwen3-vl-8b-fp8-engine-service.eva-agent.svc.cluster.local,http://10.158.2.185:8222"
  staticModels: "qwen3-vl-8b-instruct-fp8,Exaone4.0"

  # router는 외부에서 접근 가능하게 한다 (72서버는 개발 테스트용임)
  serviceType: LoadBalancer
  servicePort: 32041
  containerPort: 8000

  resources:
    requests:
      cpu: 400m
      memory: 4Gi
    limits:
      memory: 6Gi

servingEngineSpec:
  runtimeClassName: ""
  modelSpec:
    - name: "qwen3-vl-8b-fp8"
      modelURL: "Qwen/Qwen3-VL-8B-Instruct-FP8"
      repository: "vllm/vllm-openai"
      tag: "v0.11.0"

      serviceAccountName: sa-eva-agent
      replicaCount: 1

      # Vision과 같이 쓸 때는 requestGPU를 명시적으로 선언 X
      requestCPU: 4
      requestMemory: "10Gi"
      # requestGPU: 1

      pvcStorage: "30Gi"
      storageClass: "eva-agent-sc-fs"
      pvcAccessMode:
        - "ReadWriteMany"

      # vLLM settings (shared defaults)
      vllmConfig:
        host: "0.0.0.0"
        tensorParallelSize: 1
        gpuMemoryUtilization: 0.7
        enableChunkedPrefill: true
        enablePrefixCaching: true
        maxModelLen: 12288
        dtype: "auto"
        extraArgs:
          - "--served-model-name"
          - "qwen3-vl-8b-instruct-fp8"
          - "--kv-cache-dtype"
          - "auto"
          - "--max-num-batched-tokens"
          - "4096"
